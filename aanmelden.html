<body>
    <nav>
        <a class="logo" href="index.html"><img src="Images/logo.png" alt="TalentenShow"></a>
        <button class="hamburger" aria-label="Menu">
            <div class="line"></div>

            <li><a href="index.html">Home</a></li>
            <li><a href="bestellen.html">Tickets</a></li>
            <li><a href="aanmelden.html" class="actief">Meedoen</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Meld je aan als deelnemer</h1>
        <p class="intro">Laat zien wat je kunt! Na je aanmelding nemen we contact met je op over je optreden.</p>
        <form action="aanmelden.php" method="POST" class="formulier">
            <div class="rij">
                <div class="form-group">
                    <label for="name">Voornaam</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="lastname">Achternaam</label>
                    <input type="text" id="lastname" name="lastname" required>
                </div>
            </div>
            <div class="rij">
                <div class="form-group">
                    <label for="birthdate">Geboortedatum</label>
                    <input type="date" id="birthdate" name="birthdate" required>
                </div>
                <div class="form-group">
                    <label for="mobile">Telefoonnummer</label>
                    <input type="tel" id="mobile" name="mobile" required>
                </div>
            </div>
            <div class="form-group">
                <label for="address">Adres</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="form-group">
                <label for="category">Categorie</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Kies een categorie</option>
                    <option value="Singing">🎤 Zingen</option>
                    <option value="Dancing">💃 Dansen</option>
                    <option value="Comedy">😂 Comedy</option>
                    <option value="Magic">🎩 Goochelen</option>
                </select>
            </div>
            <button type="submit" class="btn">Aanmelden</button>
        </form>
    </div>

    <footer>
        <p>TalentenShow · een project van <a href="https://parisangelopoulos.com" style="color:#fff">Paris Angelopoulos</a></p>
        <div class="social-media">

            <a href="https://www.twitter.com"><img src="Images/twitter.png" alt="Twitter"></a>
            <a href="https://www.instagram.com"><img src="Images/instagram.png" alt="Instagram"></a>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
